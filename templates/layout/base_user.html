<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Paper Haven{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary-cream: #F8F5F0;
      --primary-beige: #F5F1EB;
      --accent-brown: #8B7355;
      --accent-brown-hover: #7A6548;
      --text-dark: #2D2A26;
      --text-muted: #6B6560;
      --border-light: #E8E4DE;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      background-color: var(--primary-cream);
      color: var(--text-dark);
    }

    /* ============================================
         NAVBAR STYLES
      ============================================ */
    .navbar {
      background-color: var(--white);
      border-bottom: 1px solid var(--border-light);
      padding: 1rem 0;
      transition: box-shadow 0.3s ease;
    }

    .navbar.scrolled {
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
    }

    .navbar-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-dark) !important;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .navbar-brand i {
      color: var(--accent-brown);
    }

    .nav-link {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted) !important;
      padding: 0.5rem 1.25rem !important;
      transition: color 0.2s ease;
      position: relative;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text-dark) !important;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background-color: var(--accent-brown);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      width: 30px;
    }

    .nav-cart-icon {
      position: relative;
    }

    .cart-badge {
      position: absolute;
      top: -5px;
      right: 5px;
      background-color: var(--accent-brown);
      color: white;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 600;
    }

    .navbar-toggler {
      border: none;
      padding: 0.5rem;
    }

    .navbar-toggler:focus {
      box-shadow: none;
    }

    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(43, 42, 38, 0.75)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* ============================================
         BUTTONS
      ============================================ */
    .btn-primary-custom {
      background-color: var(--accent-brown);
      border: none;
      color: white;
      padding: 0.75rem 1.75rem;
      border-radius: 50px;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .btn-primary-custom:hover {
      background-color: var(--accent-brown-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(139, 115, 85, 0.3);
    }

    .btn-outline-custom {
      background-color: transparent;
      border: 1.5px solid var(--accent-brown);
      color: var(--accent-brown);
      padding: 0.75rem 1.75rem;
      border-radius: 50px;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .btn-outline-custom:hover {
      background-color: var(--accent-brown);
      color: white;
    }

    .btn-logout {
      background-color: transparent;
      border: 1.5px solid #dc3545;
      color: #dc3545;
      padding: 0.5rem 1.25rem;
      border-radius: 50px;
      font-weight: 500;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      background-color: #dc3545;
      color: white;
    }

    /* ============================================
         MAIN CONTENT
      ============================================ */
    main {
      flex: 1;
      padding-top: 2rem;
      padding-bottom: 3rem;
    }

    /* ============================================
         FOOTER
      ============================================ */
    footer {
      background-color: var(--white);
      border-top: 1px solid var(--border-light);
      padding: 2rem 0;
      text-align: center;
    }

    footer p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin: 0;
    }

    footer a {
      color: var(--accent-brown);
      text-decoration: none;
    }

    /* ============================================
         CARDS & COMPONENTS
      ============================================ */
    .card {
      border: 1px solid var(--border-light);
      border-radius: 12px;
      background-color: var(--white);
      transition: all 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    /* ============================================
         TYPOGRAPHY
      ============================================ */
    h1,
    h2,
    h3,
    h4,
    h5 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      color: var(--text-dark);
    }

    /* ============================================
         FORM STYLES
      ============================================ */
    .form-control {
      border: 1px solid var(--border-light);
      border-radius: 50px;
      padding: 0.75rem 1.25rem;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: var(--accent-brown);
      box-shadow: 0 0 0 3px rgba(139, 115, 85, 0.1);
    }

    .form-control::placeholder {
      color: var(--text-muted);
    }

    /* ============================================
         BADGE STYLES
      ============================================ */
    .badge-custom {
      background-color: var(--accent-brown);
      color: white;
      padding: 0.35rem 0.75rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--primary-cream);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-light);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-brown);
    }
  </style>
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg" id="mainNavbar">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('customer.home') }}">
        <i class="bi bi-book-half"></i>
        Paper Haven
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#userNav"
        aria-controls="userNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="userNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('customer.home') }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('customer.shop') }}">Shop</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('customer.my_orders') }}">My Orders</a>
          </li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item nav-cart-icon">
            <a class="nav-link" href="{{ url_for('customer.view_cart') }}">
              <i class="bi bi-bag" style="font-size: 1.1rem;"></i>
              <span class="cart-badge" id="cartBadge">0</span>
            </a>
          </li>
          <li class="nav-item ms-3">
            <a class="btn-logout" href="{{ url_for('auth.logout') }}">
              <i class="bi bi-box-arrow-right me-1"></i>Logout
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="container">{% block content %}{% endblock %}</main>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <p>&copy; 2025 <strong>Paper Haven</strong>. Curated books for every reader.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Add scroll effect to navbar
    window.addEventListener('scroll', function () {
      const navbar = document.getElementById('mainNavbar');
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    // Fetch and update cart count on page load
    document.addEventListener('DOMContentLoaded', function () {
      fetchCartCount();
    });

    function fetchCartCount() {
      fetch('/customer/get_cart_count')
        .then(response => response.json())
        .then(data => {
          updateCartBadge(data.count);
        })
        .catch(error => {
          console.log('Could not fetch cart count');
        });
    }

    function updateCartBadge(count) {
      const badge = document.getElementById('cartBadge');
      if (badge) {
        if (count > 0) {
          badge.innerText = count;
          badge.style.display = 'inline-block';
        } else {
          badge.innerText = '0';
          badge.style.display = 'none';
        }
      }
    }
  </script>
</body>

</html>
